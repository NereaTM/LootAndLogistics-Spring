openapi: 3.0.3

info:
  title: Loot and Logistics API
  description: API de encargos de un gremio de aventureros
  version: 0.1.0

security:
  - ApiKeyAuth: [ ]

paths:
  # QUESTS : GET ALL + POST
  /quests:
    $ref: './paths/quests.yml'
  # QUESTS : GET ID
  /quests/{id}:
    $ref: './paths/quest-by-id.yml'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Clave de acceso a la API