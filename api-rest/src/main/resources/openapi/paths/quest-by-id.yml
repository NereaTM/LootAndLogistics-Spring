get:
  tags:
    - Quests

  operationId: getDeliveryQuest
  summary: Consulta un encargo por su id

  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    '200':
      description: Encargo encontrado
      content:
        application/json:
          schema:
            $ref: '../schemas/DeliveryQuestResponse.yml'
    '404':
      description: Encargo no encontrado