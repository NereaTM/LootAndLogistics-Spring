get:
  tags:
    - Quests

  operationId: findAllDeliveryQuests
  summary: Lista todos los encargos del tablón del gremio

  responses:
    '200':
      description: Listado de encargos (vacío si no hay ninguno)
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../schemas/DeliveryQuestResponse.yml'

post:
  tags:
    - Quests

  operationId: createDeliveryQuest
  summary: Crea un encargo nuevo en el tablón del gremio

  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/CreateDeliveryQuestRequest.yml'

  responses:
    '201':
      description: Encargo creado
      content:
        application/json:
          schema:
            $ref: '../schemas/DeliveryQuestResponse.yml'
    '400':
      description: Datos del encargo no válidos