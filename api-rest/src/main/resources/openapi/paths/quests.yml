get:
  tags:
    - Quests

  operationId: findAllDeliveryQuests
  summary: Lista todos los encargos del tablón del gremio, con filtros opcionales

  parameters:
    - name: status
      in: query
      required: false
      description: Estado del encargo
      schema:
        type: string
        enum:
          - AVAILABLE
          - ACCEPTED
          - IN_TRANSIT
          - DELIVERED
          - CANCELLED
    - name: cargoName
      in: query
      required: false
      description: Nombre exacto de la carga
      schema:
        type: string
        example: Baba de caracol
    - name: currency
      in: query
      required: false
      description: Moneda de la recompensa
      schema:
        type: string
        enum:
          - GOLD
          - SILVER
          - COPPER

  responses:
    '200':
      description: Listado de encargos (vacío si no hay ninguno)
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../schemas/DeliveryQuestResponse.yml'

post:
  tags:
    - Quests

  operationId: createDeliveryQuest
  summary: Crea un encargo nuevo en el tablón del gremio

  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/CreateDeliveryQuestRequest.yml'

  responses:
    '201':
      description: Encargo creado
      content:
        application/json:
          schema:
            $ref: '../schemas/DeliveryQuestResponse.yml'
    '400':
      description: Datos del encargo no válidos